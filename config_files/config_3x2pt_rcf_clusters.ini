; This is the configuration file for the script covariance.py which starts the covariance calculation. Run it with
;
; python3 covariance.py config_files/config_3x2pt_rcf_clusters.ini
;
; It is a first check of the cross-covariance between galaxy clusters (number counts and cluster lensing) and the
; real-space 3x2pt statistics (xi_pm, gamma_t, w), for an SPT-like cluster sample on a DES-Y3-like survey, in the spirit
; of the halo-model covariance test of Bocquet et al. (2024, arXiv:2412.07765). Only the settings specific to this
; set-up are commented here, see config.ini for the documentation of all parameters.
;
; How clusters enter the code: a halo hosts at most one cluster, so clusters are central "galaxies" whose observable
; (here a mass proxy, obs = M with a lognormal scatter of 0.1 dex at fixed mass) plays the role of the stellar mass:
;   - the cluster number counts in bins of observable and redshift are the conditional stellar mass function (SMF,
;     cstellar_mf = True) in the [csmf settings], with V_max the comoving volume of each redshift bin, so that the
;     SMF per dex is Phi = N/(Delta log10 obs V_max) with N the number of clusters in the bin;
;   - cluster lensing is galaxy-galaxy lensing (gamma_t) with the clusters as lenses, i.e. galaxy samples defined by
;     bins of the observable in the [bias] section.
; The HOD is central-only (the satellites are switched off by a vanishing normalisation of their mass-observable
; relation, dpow_norm_sat = 1e-30; exactly zero gives NaNs). As there is a single HOD for all samples, the 3x2pt lens
; galaxies are modelled with the same central-only HOD, as a fourth sample on a disjoint range of the observable
; (centrals of haloes with 10^12.4 < M < 10^14.65 M_sun/h, number densities similar to DES MagLim). Their
; one-halo term is therefore not realistic, which does not matter after the usual 3x2pt scale cuts.
;
; Galaxy samples (s1, s2 in the list output):
;   sample 1: 3x2pt lens galaxies,        log10 obs in [12.4, 14.65]
;   samples 2, 3, 4: clusters,            log10 obs in [14.65, 14.8], [14.8, 15.0], [15.0, 15.8] (M200m in M_sun/h)
; with three top-hat redshift bins (0.25-0.45, 0.45-0.65, 0.65-0.95) for both lenses and clusters, four DES-Y3-like
; source bins and 4000 deg^2. The cluster counts use the same three observable bins, 9 bins in total with about 720
; clusters (similar to the ~690 SPT clusters with DES lensing at z < 0.95).
;
; The output contains all blocks, from which the data vector is selected afterwards: only the w of sample 1, gamma_t of
; sample 1 (galaxy-galaxy lensing) and of samples 2-4 (cluster lensing, e.g. 0.5 Mpc/h < R < 3.2/(1+z) Mpc/h
; physical), xi_pm and the counts (csmfcsmf, csmfgg, csmfgm, csmfxip, csmfxim). The cross-covariance between the
; clusters and the 3x2pt statistics then follows from the blocks between the two sets.
;
; Limitations of this first check: the mass-observable relation does not evolve with redshift, the selection is a
; simple cut in a lognormal mass proxy (not the SPT selection in detection significance with field-dependent
; thresholds), the lens galaxies have no satellites and there are no one-halo terms between cluster member galaxies
; and the lens galaxies.

[covariance terms]
gauss = True
split_gauss = True
nongauss = True
ssc = True

[observables]
cosmic_shear = True
est_shear = xi_pm
ggl = True
est_ggl = gamma_t
clustering = True
est_clust = w
; the cluster number counts
cstellar_mf = True
cross_terms = True
unbiased_clustering = False

[output settings]
directory = ./output/
file = covariance_list_3x2pt_rcf_clusters.dat, covariance_matrix_3x2pt_rcf_clusters.mat
style = list, matrix
list_style_spatial_first = True
corrmatrix_plot = correlation_coefficient_3x2pt_rcf_clusters.pdf
save_configs = save_configs_3x2pt_rcf_clusters.ini
; the C_ells are needed for the theory data vector of a signal-to-noise test
save_Cells = True
save_alms = False
use_tex = False

[covELLspace settings]
delta_z = 0.08
tri_delta_z = 0.5
integration_steps = 500
nz_interpolation_polynom_order = 1
mult_shear_bias = 0, 0, 0, 0
; cluster lensing reaches down to ~1.5 arcmin
ell_max = 100000
ell_bins = 200
ell_min = 2
ell_type = log

; n_eff_clust: one number density (1/arcmin^2) per tomographic bin and sample, all samples of the first tomographic
; bin, then those of the second, ...: (galaxies, clusters 1, 2, 3) per redshift bin. They follow from the same mass
; function and HOD as used in the code, integrated over the top-hat redshift bins.
[survey specs]
survey_area_clust_in_deg2 = 4000
n_eff_clust = 7.008810e-02, 1.388809e-05, 5.886952e-06, 1.346256e-06, 1.263018e-01, 1.212215e-05, 4.330665e-06, 7.420708e-07, 2.601654e-01, 8.673347e-06, 2.469361e-06, 2.955142e-07
survey_area_ggl_in_deg2 = 4000
survey_area_lensing_in_deg2 = 4000
ellipticity_dispersion = 0.243, 0.262, 0.259, 0.301
n_eff_lensing = 1.476, 1.479, 1.484, 1.461

; the clusters and the 3x2pt lens galaxies share the top-hat redshift bins; the counts (zcsmf_file) use the same bins
[redshift]
z_directory = ./input/redshift_distribution
zclust_file = clusters_spt_like_tophat_nz.asc
value_loc_in_clustbin = mid
zlens_file = source_des_y3_like_nz.asc
value_loc_in_lensbin = mid
zcsmf_file = clusters_spt_like_tophat_nz.asc
value_loc_in_csmfbin = mid

[cosmo]
sigma8 = 0.8
h = 0.7
omega_m = 0.3
omega_b = 0.05
omega_de = 0.7
w0 = -1.0
wa = 0.0
ns = 0.965
neff = 3.046
m_nu = 0.0

; the samples are bins in the observable (log10 M200m in M_sun/h for obs = M): sample 1 are the 3x2pt lens galaxies,
; samples 2-4 the clusters
[bias]
model = Tinker10
bias_2h = 1.0
mc_relation_cen = duffy08
mc_relation_sat = duffy08
norm_mc_relation_cen = 1.0
norm_mc_relation_sat = 1.0
log10mass_bins_lower = 12.4, 14.65, 14.8, 15.0
log10mass_bins_upper = 14.65, 14.8, 15.0, 15.8

[IA]
A_IA = 0.5
eta_IA = 0.0
z_pivot_IA = 0.62

; Central-only HOD with the mass proxy obs = 10^(logm0 + a log10(M/M1)) for a = b (a single power law, here obs = M),
; with a lognormal scatter of logn_sigma_c_cen dex at fixed halo mass. The satellites are switched off by
; dpow_norm_sat = 1e-30 (their remaining parameters do not matter).
[hod]
model_mor_cen = double_powerlaw
model_mor_sat = double_powerlaw
dpow_logm0_cen = 12.0
dpow_logm1_cen = 12.0
dpow_a_cen = 1.0
dpow_b_cen = 1.0
dpow_norm_cen = 1.0
dpow_logm0_sat = 12.0
dpow_logm1_sat = 12.0
dpow_a_sat = 1.0
dpow_b_sat = 1.0
dpow_norm_sat = 1e-30
model_scatter_cen = lognormal
model_scatter_sat = modschechter
logn_sigma_c_cen = 0.1
modsch_logmref_sat = 13.0
modsch_alpha_s_sat = -0.858
modsch_b_sat = -0.024, 1.149
poisson_sat = 1.0

; The cluster counts in the three observable bins of the cluster samples and the three redshift bins. V_max is the
; comoving volume of each redshift bin (4000 deg^2), starting at V_max_zmin, so that the SMF window of each bin is the
; top-hat of the redshift bin. The SMF and its covariance are averaged over the (wide) observable bins.
[csmf settings]
csmf_log10M_bins = 14.65, 14.8, 15.0, 15.8
csmf_directory = ./input/conditional_smf/
V_max_file = V_max_clusters_spt_like.asc
V_max_zmin = 0.25, 0.45, 0.65
csmf_diagonal = False
csmf_diagonal_lenses = False
csmf_auto_only = False

; The clustering angular bins are used for w and gamma_t, the lensing ones for xi_pm. They extend to small scales for
; the cluster lensing (1.5 - 13 arcmin): select the scales of each probe from the output.
[covTHETAspace settings]
theta_min_clustering = 1.0
theta_max_clustering = 250.0
theta_bins_clustering = 24
theta_type_clustering = log
theta_min_lensing = 2.5
theta_max_lensing = 250.0
theta_bins_lensing = 20
theta_type_lensing = log
xi_pp = True
xi_mm = True
theta_accuracy = 1e-2
integration_intervals = 400

[halomodel evaluation]
m_bins = 900
log10m_min = 6
log10m_max = 18
hmf_model = Tinker10
mdef_model = SOMean
mdef_params = overdensity, 200
disable_mass_conversion = True
delta_c = 1.686
transfer_model = CAMB
small_k_damping_for1h = damped

[powspec evaluation]
non_linear_model = mead2020
HMCode_logT_AGN = 7.3
log10k_bins = 200
log10k_min = -3.49
log10k_max = 2.15

[trispec evaluation]
log10k_bins = 100
log10k_min = -3.49
log10k_max = 2.
matter_klim = 0.001
matter_mulim = 0.001
small_k_damping_for1h = damped
lower_calc_limit = 1e-200

[misc]
num_cores = 8
