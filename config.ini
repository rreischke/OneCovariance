; Arbitrary radial kernel section:
;
; This sections should be used in two cases:
;   (i)  You do not like the summary statistics provided by the code and have your own
;   (ii) You would like to calculate the covariance between different summary statistcs which are not supported in the previous section:
;        e.g. Bandpowers and COSEBIs. This can be true on a single tracer, for example for consistency checks, or for different tracers.
; In both cases you MUST provide the Fourier space AND Real space Filter functions for all the summary statistics.
; Make sure to set the file paths in the [tabulated inputs files] section to the corresponding filter functions (otherwise everything will explode)
; WARNING: If this section is activated, the inputs in the observables section are IGNORED.
;   do_arbitrary_radial_weight:        Should the input for arbitrary observables be used? 
;                                      If 'True', the observables section is IGNORED. Leave blank or set False for standard settings.
;                                      Parameters: True or False (if set)
;   add_to_matter:                     If 'True', the arbitrary radial kernels (see tabulated input section) are appended to the lensing kernels as given by the respective
;                                      n(z) in the redshift sections. If 'False', all matter radial kernels are replaced by the arbitrary kernels.
;   add_to_galaxy:                     If 'True', the arbitrary radial kernels (see tabulated input section) are appended to the clustering kernels as given by the respective
;                                      n(z) in the redshift sections. If 'False', all matter radial kernels are replaced by the arbitrary kernels.
[arbitrary_kernel]
do_arbitrary_radial_weight = False
add_to_matter = False
add_to_galaxy = False


[magnification]
;   magnification:         Should the magnification bias contribution be included for clustering?
;                          Parameters: True or False (default: False)
;   s_of_z_directory:      Where to find the redshift distribution files for the magnification bias contribution.
;                          Parameters: path to directory as string
;   s_of_z_file:           Filenames of the redshift distribution files for the magnification bias contribution for N_lens bins
;                          Parameters: Either a single file with the style (files can be ascii or fits)
;                                   redshift   s_1(z) ... s_{N_lens}(z)
;                                      ...      ...           ...
;                                  Or N_lens files i separated by comma with the style
;                                   redshift   s_i(z)
;                                      ...      ...
;                                  Note that they all have to have the same number of z and s(z) values.
;   value_loc_in_s_of_oz:  Where in each z_bin (this is the bin in the histogram of n(z), not the tomographic bin) should the value of s(z) be associated to?
;                          Parameters: Either mid, left or right
magnification = False
s_of_z_directory = ./input/redshift_distribution/
s_of_z_file = 
